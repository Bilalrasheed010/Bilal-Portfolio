<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient
      id="bm-frame"
      x1="0"
      y1="0"
      x2="40"
      y2="40"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.30" />
    </linearGradient>

    <style type="text/css">
      /* The M half of the ligature slowly tints to the portfolio's
         accent violet, holds for a beat, then returns to white.
         Total cycle: 5.5s. Same visual gesture as the site's
         hover state on the navbar brand. */
      .bm-m {
        animation: bmMTint 5500ms ease-in-out infinite;
      }
      @keyframes bmMTint {
        0%, 68%, 100% { stroke: #F2F2F4; }
        78%           { stroke: #A07BFF; }
        86%           { stroke: #A07BFF; }
        94%           { stroke: #F2F2F4; }
      }
    </style>
  </defs>

  <!-- Dark rounded container -->
  <rect width="40" height="40" rx="8" fill="#06060A" />

  <!-- Subtle gradient border -->
  <rect
    x="0.5"
    y="0.5"
    width="39"
    height="39"
    rx="7.5"
    fill="none"
    stroke="url(#bm-frame)"
    stroke-width="1"
  />

  <!-- M — left stem, apex, right stem (shared with B) -->
  <path
    class="bm-m"
    d="M 5 33 L 5 7 L 13 20 L 21 7 L 21 33"
    stroke="#F2F2F4"
    stroke-width="2.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />

  <!-- B — two outward bumps attached to the shared spine -->
  <path
    d="M 21 7 L 29 7 L 32 10 L 32 16 L 29 20 L 21 20
       M 21 20 L 30 20 L 33 25 L 33 30 L 30 33 L 21 33"
    stroke="#F2F2F4"
    stroke-width="2.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
    fill="none"
  />
</svg>